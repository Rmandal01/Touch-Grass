name: growflow
description: GrowFlow — a productivity app that grows a virtual garden.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Backend (auth, Postgres, Edge Functions, Realtime)
  supabase_flutter: ^2.5.6

  # Android per-app screen time via UsageStatsManager
  app_usage: ^4.1.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Plant assets are added by the team; the PlantRenderer is format-agnostic.
  # assets:
  #   - assets/plants/
